data:
  module: datasets.protein_clouds
  root_dir: ./data/cath_npz_split
  batch_size: 16
  num_workers: 0
  pin_memory: true
  seed: 14

  L_max: 500
  min_len: 128
  max_len: 500

  no_scale: false
  scale_by: 100
  uniform_scale: true


trainer: &ref-trainer
  module: trainer
  seed: 1111
  max_epochs: 50000
  log_every_n_steps: 1
  accelerator: auto
  precision: null
  checkpoint_interval: 20

  save_dir: trainer/rmsd
  model_name: model.ckpt
  results_dir: ./results


rmsd_modelconfig:
  module: models.rmsd_decoder
  L_max: 500
  learning_rate: 0.0001


logger:
  module: loggers.wandblogger
  project: PointClouds
  entity: mat-bondarev-epfl
  trainconfig: *ref-trainer
  results_dir: rmsd_train