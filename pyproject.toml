[project]
name = "protein_ordering"
version = "0.1.0"
description = "Protein point-cloud ordering"
requires-python = ">=3.10,<3.11"
readme = "README.md"

dependencies = [
    "torch==2.5.1",
    "lightning>=2.4.0,<3",
    "torch-geometric>=2.6.1,<3",
    "torch-cluster==1.6.3",
    "e3nn>=0.6.0",
    "pydantic>=2.10.4,<3",
    "wandb>=0.19.1,<0.20",
    "matplotlib>=3.10.0,<4",
    "torchinfo>=1.8.0",
    "numpy",
    "pyyaml",
    "tqdm",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5,<7",
    "basedpyright>=1.31.4",
    "pytest>=8.3.4,<9",
]

[tool.uv]
default-groups = ["dev"]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pyg-cu124"
url = "https://data.pyg.org/whl/torch-2.5.0+cu124.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torch-cluster = { index = "pyg-cu124" }

[tool.pyright]
ignore = ["tests"]
venvPath = "."
venv = ".venv"